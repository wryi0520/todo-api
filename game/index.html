<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Simple 3D Shooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --val-red: #ff4655;
    --val-red-dim: #bd3944;
    --val-dark: #0f1923;
    --val-dark2: #1f2731;
    --val-teal: #5ce1e6;
    --val-white: #ece8e1;
    --val-gray: #8b978f;
  }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; }
  canvas { display: block; }
  body { font-family: 'Rajdhani', sans-serif; }

  /* ---------- Crosshair ---------- */
  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 28px; height: 28px;
    pointer-events: none;
  }
  #crosshair .dot {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--val-teal);
    box-shadow: 0 0 2px rgba(0,0,0,0.9);
  }
  #crosshair .bar {
    position: absolute; background: var(--val-teal);
    box-shadow: 0 0 2px rgba(0,0,0,0.9);
  }
  #crosshair .bar.h { top: 50%; width: 8px; height: 2px; transform: translateY(-50%); }
  #crosshair .bar.h.left { left: 0; }
  #crosshair .bar.h.right { right: 0; }
  #crosshair .bar.v { left: 50%; width: 2px; height: 8px; transform: translateX(-50%); }
  #crosshair .bar.v.top { top: 0; }
  #crosshair .bar.v.bottom { bottom: 0; }

  /* ---------- Top HUD: round timer + score pips ---------- */
  #round-hud {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    display: flex; align-items: stretch;
    font-family: 'Teko', sans-serif;
    pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  #round-hud .side {
    background: var(--val-dark2); color: var(--val-white);
    display: flex; align-items: center; padding: 4px 18px;
    font-size: 26px; font-weight: 600; letter-spacing: 1px;
  }
  #round-hud .side.atk { clip-path: polygon(0 0, 100% 0, 88% 100%, 0% 100%); padding-right: 26px; }
  #round-hud .side.def { clip-path: polygon(12% 0, 100% 0, 100% 100%, 0% 100%); padding-left: 26px; }
  #round-hud .timer {
    background: var(--val-dark); color: var(--val-white);
    min-width: 70px; text-align: center;
    font-size: 30px; font-weight: 700; padding: 4px 14px;
    border-left: 1px solid rgba(255,255,255,0.08);
    border-right: 1px solid rgba(255,255,255,0.08);
  }

  /* ---------- Kill feed ---------- */
  #killfeed {
    position: fixed; top: 64px; right: 14px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    pointer-events: none;
  }
  #killfeed .entry {
    background: rgba(15, 25, 35, 0.75); color: var(--val-white);
    font-size: 15px; font-weight: 600; padding: 4px 10px;
    border-right: 3px solid var(--val-red);
    opacity: 0; transform: translateX(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
  }
  #killfeed .entry.show { opacity: 1; transform: translateX(0); }
  #killfeed .entry .name { color: var(--val-teal); }
  #killfeed .entry .verb { color: var(--val-gray); margin: 0 4px; font-size: 12px; }

  /* ---------- Bottom-left: agent info ---------- */
  #agent-hud {
    position: fixed; bottom: 16px; left: 16px;
    display: flex; align-items: center; gap: 10px;
    pointer-events: none;
  }
  #agent-hud .portrait {
    width: 46px; height: 46px; border-radius: 4px;
    background: linear-gradient(155deg, var(--val-red), var(--val-dark2));
    border: 2px solid var(--val-white);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Teko', sans-serif; font-size: 22px; color: var(--val-white); font-weight: 700;
  }
  #agent-hud .meta { color: var(--val-white); }
  #agent-hud .agent-name {
    font-family: 'Teko', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 1px;
  }
  #agent-hud .score-line {
    font-size: 14px; color: var(--val-gray);
  }
  #agent-hud .score-line #score { color: var(--val-red); font-weight: 700; }

  /* ---------- Bottom-center: weapon panel ---------- */
  #weapon-hud {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    background: rgba(15, 25, 35, 0.55); padding: 8px 20px;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    pointer-events: none;
  }
  #weapon-hud .icon {
    width: 44px; height: 20px; position: relative;
  }
  #weapon-hud .icon svg { width: 100%; height: 100%; fill: var(--val-white); }
  #weapon-hud .ammo-block { display: flex; flex-direction: column; align-items: flex-end; }
  #weapon-hud .weapon-name {
    font-family: 'Teko', sans-serif; font-size: 16px; color: var(--val-gray);
    letter-spacing: 2px; text-transform: uppercase;
  }
  #weapon-hud .ammo {
    font-family: 'Teko', sans-serif; font-size: 32px; color: var(--val-white); font-weight: 700; line-height: 1;
  }

  /* ---------- Bottom-right: ability bar ---------- */
  #ability-hud {
    position: fixed; bottom: 16px; right: 16px;
    display: flex; gap: 6px;
    pointer-events: none;
  }
  #ability-hud .slot {
    width: 48px; height: 48px;
    background: var(--val-dark2); border: 1px solid rgba(255,255,255,0.15);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--val-white);
  }
  #ability-hud .slot .key {
    font-family: 'Teko', sans-serif; font-size: 15px; font-weight: 700; color: var(--val-gray);
  }
  #ability-hud .slot .icon { font-size: 16px; }
  #ability-hud .slot.ult {
    border-color: var(--val-red);
    background: linear-gradient(160deg, rgba(255,70,85,0.25), var(--val-dark2));
  }
  #ability-hud .slot.ult .key { color: var(--val-red); }

  /* ---------- Start overlay ---------- */
  #overlay {
    position: fixed; inset: 0; background: rgba(15, 25, 35, 0.92);
    color: var(--val-white);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
  }
  #overlay .accent-bar {
    width: 120px; height: 4px; background: var(--val-red); margin-bottom: 18px;
    clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
  }
  #overlay h1 {
    margin: 0 0 10px; font-family: 'Teko', sans-serif; font-size: 56px;
    letter-spacing: 3px; text-transform: uppercase; font-weight: 700;
  }
  #overlay h1 span { color: var(--val-red); }
  #overlay p { margin: 4px 0; opacity: 0.85; font-size: 16px; font-weight: 500; letter-spacing: 0.5px; }
  #overlay .start-hint {
    margin-top: 22px; color: var(--val-red); font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; font-size: 14px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="crosshair">
  <div class="bar h left"></div>
  <div class="bar h right"></div>
  <div class="bar v top"></div>
  <div class="bar v bottom"></div>
  <div class="dot"></div>
</div>

<div id="round-hud">
  <div class="side atk">ATK <span style="color:var(--val-red)">3</span></div>
  <div class="timer" id="round-timer">1:40</div>
  <div class="side def">DEF <span style="color:var(--val-teal)">2</span></div>
</div>

<div id="killfeed"></div>

<div id="agent-hud">
  <div class="portrait">J</div>
  <div class="meta">
    <div class="agent-name">JETT</div>
    <div class="score-line">SCORE <span id="score">0</span></div>
  </div>
</div>

<div id="weapon-hud">
  <div class="icon">
    <svg viewBox="0 0 100 24" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="9" width="60" height="6" rx="1"></rect>
      <rect x="55" y="0" width="8" height="9"></rect>
      <rect x="60" y="12" width="30" height="4" rx="1"></rect>
      <rect x="12" y="15" width="6" height="9"></rect>
    </svg>
  </div>
  <div class="ammo-block">
    <div class="weapon-name">Vandal</div>
    <div class="ammo"><span id="ammo">∞</span></div>
  </div>
</div>

<div id="ability-hud">
  <div class="slot"><div class="key">C</div><div class="icon">◆</div></div>
  <div class="slot"><div class="key">Q</div><div class="icon">◈</div></div>
  <div class="slot"><div class="key">E</div><div class="icon">▲</div></div>
  <div class="slot ult"><div class="key">X</div><div class="icon">★</div></div>
</div>

<div id="overlay">
  <div class="accent-bar"></div>
  <h1>SIMPLE <span>3D</span> SHOOTER</h1>
  <p>WASD 이동 · 마우스로 시점 조작 · 클릭으로 발사</p>
  <p>Shift: 달리기 · Space: 점프</p>
  <div class="start-hint">클릭해서 시작</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

// ---------- Basic setup ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x88ccee);
scene.fog = new THREE.Fog(0x88ccee, 20, 120);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Lighting ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
scene.add(sun);

// ---------- Ground ----------
const groundSize = 150;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(groundSize, groundSize),
  new THREE.MeshStandardMaterial({ color: 0x4a8f3c })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(groundSize, 30, 0x226622, 0x226622);
grid.position.y = 0.01;
scene.add(grid);

// ---------- Obstacles (also act as walls to block movement) ----------
const obstacles = [];
const boxMat = new THREE.MeshStandardMaterial({ color: 0xaa7744 });
function addBox(x, z, w, h, d) {
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), boxMat);
  box.position.set(x, h / 2, z);
  box.castShadow = true;
  box.receiveShadow = true;
  scene.add(box);
  obstacles.push({
    mesh: box,
    minX: x - w / 2, maxX: x + w / 2,
    minZ: z - d / 2, maxZ: z + d / 2,
  });
}
addBox(10, -10, 4, 3, 4);
addBox(-12, -6, 3, 4, 3);
addBox(6, 14, 5, 2.5, 5);
addBox(-8, 16, 3, 3, 6);
addBox(0, -20, 6, 3, 3);

// Boundary walls
const wallMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
function addWall(x, z, w, d) {
  const h = 4;
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  wall.position.set(x, h / 2, z);
  wall.castShadow = true;
  wall.receiveShadow = true;
  scene.add(wall);
  obstacles.push({
    mesh: wall,
    minX: x - w / 2, maxX: x + w / 2,
    minZ: z - d / 2, maxZ: z + d / 2,
  });
}
const half = groundSize / 2;
addWall(0, -half, groundSize, 1);
addWall(0, half, groundSize, 1);
addWall(-half, 0, 1, groundSize);
addWall(half, 0, 1, groundSize);

// ---------- Targets ----------
const targets = [];
const targetGeo = new THREE.SphereGeometry(0.8, 16, 16);
function spawnTarget() {
  const mat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
  const mesh = new THREE.Mesh(targetGeo, mat);
  const margin = 15;
  let x, z;
  do {
    x = (Math.random() - 0.5) * (groundSize - margin * 2);
    z = (Math.random() - 0.5) * (groundSize - margin * 2);
  } while (Math.hypot(x, z) < 6);
  mesh.position.set(x, 1, z);
  mesh.castShadow = true;
  scene.add(mesh);
  targets.push(mesh);
}
for (let i = 0; i < 8; i++) spawnTarget();

// ---------- Player controller ----------
const player = {
  height: 1.7,
  radius: 0.4,
  velocityY: 0,
  onGround: true,
  position: new THREE.Vector3(0, 0, 8),
  yaw: 0,
  pitch: 0,
};
camera.position.set(player.position.x, player.height, player.position.z);

const keys = {};
window.addEventListener("keydown", (e) => (keys[e.code] = true));
window.addEventListener("keyup", (e) => (keys[e.code] = false));

const overlay = document.getElementById("overlay");
document.body.addEventListener("click", () => {
  if (document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  } else {
    shoot();
  }
});

document.addEventListener("pointerlockchange", () => {
  const locked = document.pointerLockElement === renderer.domElement;
  overlay.classList.toggle("hidden", locked);
});

const MOUSE_SENS = 0.0022;
document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== renderer.domElement) return;
  player.yaw -= e.movementX * MOUSE_SENS;
  player.pitch -= e.movementY * MOUSE_SENS;
  const limit = Math.PI / 2 - 0.05;
  player.pitch = Math.max(-limit, Math.min(limit, player.pitch));
});

// ---------- Kill feed ----------
const killfeedEl = document.getElementById("killfeed");
function pushKillfeed(text) {
  const entry = document.createElement("div");
  entry.className = "entry";
  entry.innerHTML = `<span class="name">YOU</span><span class="verb">eliminated</span>${text}`;
  killfeedEl.appendChild(entry);
  requestAnimationFrame(() => entry.classList.add("show"));
  while (killfeedEl.children.length > 4) killfeedEl.removeChild(killfeedEl.firstChild);
  setTimeout(() => {
    entry.classList.remove("show");
    setTimeout(() => entry.remove(), 250);
  }, 2800);
}

// ---------- Round timer (cosmetic) ----------
const timerEl = document.getElementById("round-timer");
let roundTime = 100;
function formatTime(t) {
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}
setInterval(() => {
  roundTime -= 1;
  if (roundTime < 0) roundTime = 100;
  timerEl.textContent = formatTime(roundTime);
}, 1000);

// ---------- Shooting ----------
let score = 0;
const scoreEl = document.getElementById("score");
const raycaster = new THREE.Raycaster();

const BULLET_SPEED = 90;

// bullets share one geometry/material (identical look) to avoid per-shot allocation
const bulletGeometry = new THREE.SphereGeometry(0.06, 6, 6);
const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffe066 });
const MAX_BULLETS = 24;
const bulletPool = [];
for (let i = 0; i < MAX_BULLETS; i++) {
  const mesh = new THREE.Mesh(bulletGeometry, bulletMaterial);
  mesh.visible = false;
  scene.add(mesh);

  const trailPositions = new Float32Array(6);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute("position", new THREE.BufferAttribute(trailPositions, 3).setUsage(THREE.DynamicDrawUsage));
  const trailMat = new THREE.LineBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.9 });
  const trail = new THREE.Line(trailGeo, trailMat);
  trail.visible = false;
  trail.frustumCulled = false;
  scene.add(trail);

  bulletPool.push({
    mesh, trail, trailPositions,
    start: new THREE.Vector3(), end: new THREE.Vector3(),
    dist: 1, traveled: 0, hitTarget: null, active: false, done: false, fade: 0,
  });
}
let bulletCursor = 0;
const tmpBulletPos = new THREE.Vector3();

function shoot() {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  raycaster.set(camera.position, dir);

  const hits = raycaster.intersectObjects(targets, false);
  const start = camera.position.clone();
  let end = start.clone().add(dir.multiplyScalar(150));
  let hitTarget = null;
  if (hits.length > 0) {
    end = hits[0].point.clone();
    hitTarget = hits[0].object;
  }

  const b = bulletPool[bulletCursor];
  bulletCursor = (bulletCursor + 1) % bulletPool.length;

  b.start.copy(start);
  b.end.copy(end);
  b.dist = Math.max(start.distanceTo(end), 0.001);
  b.traveled = 0;
  b.hitTarget = hitTarget;
  b.active = true;
  b.done = false;
  b.fade = 0;
  b.mesh.position.copy(start);
  b.mesh.visible = true;
  b.trail.visible = true;
  b.trail.material.opacity = 0.9;
  const p = b.trailPositions;
  p[0] = start.x; p[1] = start.y; p[2] = start.z;
  p[3] = start.x; p[4] = start.y; p[5] = start.z;
  b.trail.geometry.attributes.position.needsUpdate = true;
}

// ---------- Paint splash on hit (pooled particles, no per-hit allocation) ----------
const PAINT_COLORS = [0xff3355, 0x33aaff, 0xffee33, 0x33ff88, 0xff33ee, 0xff8800];
const particleGeometry = new THREE.SphereGeometry(1, 6, 6); // unit sphere, sized via mesh.scale
const MAX_PARTICLES = 90;
const particlePool = [];
for (let i = 0; i < MAX_PARTICLES; i++) {
  const mat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 });
  const mesh = new THREE.Mesh(particleGeometry, mat);
  mesh.visible = false;
  scene.add(mesh);
  particlePool.push({
    mesh, mat, vel: new THREE.Vector3(),
    life: 0, age: 0, baseScale: 1, isFlash: false, active: false,
  });
}
let particleCursor = 0;

function spawnParticle(point, color, vel, life, baseScale, isFlash) {
  const p = particlePool[particleCursor];
  particleCursor = (particleCursor + 1) % particlePool.length;
  p.mesh.position.copy(point);
  p.mesh.scale.setScalar(baseScale);
  p.mat.color.setHex(color);
  p.mat.opacity = isFlash ? 0.6 : 1;
  p.mesh.visible = true;
  p.vel.copy(vel);
  p.life = life;
  p.age = 0;
  p.baseScale = baseScale;
  p.isFlash = isFlash;
  p.active = true;
}

const ZERO_VEC = new THREE.Vector3();

function paintSplash(point, baseColor) {
  const count = 12;
  for (let i = 0; i < count; i++) {
    const color = Math.random() < 0.5 ? baseColor : PAINT_COLORS[Math.floor(Math.random() * PAINT_COLORS.length)];
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI;
    const speed = 2 + Math.random() * 3.5;
    const vel = new THREE.Vector3(
      Math.sin(phi) * Math.cos(theta),
      Math.cos(phi) * 0.7 + 0.6,
      Math.sin(phi) * Math.sin(theta)
    ).multiplyScalar(speed);
    spawnParticle(point, color, vel, 0.5 + Math.random() * 0.35, 0.05 + Math.random() * 0.06, false);
  }
  spawnParticle(point, baseColor, ZERO_VEC, 0.22, 0.25, true);
}

// ---------- Movement / collision ----------
const MOVE_SPEED = 6;
const RUN_MULT = 1.7;
const JUMP_SPEED = 6.5;
const GRAVITY = 18;

function resolveCollision(pos) {
  for (const ob of obstacles) {
    const closestX = Math.max(ob.minX, Math.min(pos.x, ob.maxX));
    const closestZ = Math.max(ob.minZ, Math.min(pos.z, ob.maxZ));
    const dx = pos.x - closestX;
    const dz = pos.z - closestZ;
    const distSq = dx * dx + dz * dz;
    const r = player.radius;
    if (distSq < r * r) {
      const dist = Math.sqrt(distSq) || 0.0001;
      const overlap = r - dist;
      pos.x += (dx / dist) * overlap;
      pos.z += (dz / dist) * overlap;
    }
  }
  return pos;
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // camera orientation
  camera.rotation.order = "YXZ";
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  // movement input relative to yaw (W = forward, S = backward)
  let forward = 0, right = 0;
  if (keys["KeyW"]) forward += 1;
  if (keys["KeyS"]) forward -= 1;
  if (keys["KeyA"]) right -= 1;
  if (keys["KeyD"]) right += 1;

  if (forward !== 0 || right !== 0) {
    const len = Math.hypot(forward, right);
    forward /= len; right /= len;
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    const worldX = right * cos - forward * sin;
    const worldZ = -right * sin - forward * cos;
    const speed = MOVE_SPEED * (keys["ShiftLeft"] || keys["ShiftRight"] ? RUN_MULT : 1);
    player.position.x += worldX * speed * dt;
    player.position.z += worldZ * speed * dt;
  }

  resolveCollision(player.position);

  // boundary clamp
  const b = groundSize / 2 - 1;
  player.position.x = Math.max(-b, Math.min(b, player.position.x));
  player.position.z = Math.max(-b, Math.min(b, player.position.z));

  // jump / gravity
  if (keys["Space"] && player.onGround) {
    player.velocityY = JUMP_SPEED;
    player.onGround = false;
  }
  player.velocityY -= GRAVITY * dt;
  player.position.y += player.velocityY * dt;
  if (player.position.y <= 0) {
    player.position.y = 0;
    player.velocityY = 0;
    player.onGround = true;
  }

  camera.position.set(player.position.x, player.position.y + player.height, player.position.z);

  // bullets: travel from muzzle to impact point, drawing a trail (pooled, in-place updates)
  for (const b of bulletPool) {
    if (!b.active) continue;
    if (!b.done) {
      b.traveled += BULLET_SPEED * dt;
      const t = Math.min(b.traveled / b.dist, 1);
      tmpBulletPos.copy(b.start).lerp(b.end, t);
      b.mesh.position.copy(tmpBulletPos);
      const p = b.trailPositions;
      p[3] = tmpBulletPos.x; p[4] = tmpBulletPos.y; p[5] = tmpBulletPos.z;
      b.trail.geometry.attributes.position.needsUpdate = true;

      if (t >= 1) {
        b.done = true;
        b.mesh.visible = false;
        if (b.hitTarget && targets.includes(b.hitTarget)) {
          paintSplash(b.end, b.hitTarget.material.color.getHex());
          scene.remove(b.hitTarget);
          targets.splice(targets.indexOf(b.hitTarget), 1);
          score += 1;
          scoreEl.textContent = String(score);
          pushKillfeed("<span class=\"name\">TARGET</span>");
          spawnTarget();
        }
      }
    } else {
      b.fade += dt;
      b.trail.material.opacity = Math.max(0, 0.9 * (1 - b.fade / 0.15));
      if (b.fade >= 0.15) {
        b.trail.visible = false;
        b.active = false;
      }
    }
  }

  // paint particles: burst outward, fall with gravity, fade out (pooled)
  for (const p of particlePool) {
    if (!p.active) continue;
    p.age += dt;
    if (p.isFlash) {
      p.mesh.scale.setScalar(p.baseScale * (1 + 6 * p.age));
      p.mat.opacity = Math.max(0, 0.6 * (1 - p.age / p.life));
    } else {
      p.vel.y -= 9 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mat.opacity = Math.max(0, 1 - p.age / p.life);
      p.mesh.scale.setScalar(p.baseScale * Math.max(0.001, 1 - p.age / p.life));
    }
    if (p.age >= p.life) {
      p.mesh.visible = false;
      p.active = false;
    }
  }

  // gentle bob on targets
  const time = performance.now() * 0.002;
  for (const tgt of targets) {
    tgt.position.y = 1 + Math.sin(time + tgt.id) * 0.15;
    tgt.rotation.y += dt;
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
